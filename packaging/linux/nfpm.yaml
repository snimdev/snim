# Packages the release workflow's AppDir; run from the repository root with
# SNIM_VERSION and SNIM_ARCH (amd64 or arm64) set.
name: snim
version: ${SNIM_VERSION}
# Turns 1.0.0-beta.1 into 1.0.0~beta.1, which sorts below 1.0.0 in dpkg and rpm.
version_schema: semver
arch: ${SNIM_ARCH}
platform: linux
maintainer: Darko Gjorgjijoski <dg@darkog.com>
vendor: Snim
homepage: https://snim.dev
license: GPL-3.0-or-later
section: graphics
description: |-
  Screenshot, screen recording, OCR and upload tool
  Snim captures areas, windows and screens, annotates them, records the screen
  with an optional webcam bubble, copies recognized text and uploads to S3, SFTP
  or FTP. Qt is bundled under /opt/snim; GStreamer and Wayland come from the system.

contents:
  # Owned explicitly, or rpm leaves it behind on removal.
  - dst: /opt/snim
    type: dir
  # usr alone: the AppDir root holds only linuxdeploy's AppImage leftovers (AppRun, hooks).
  - src: AppDir/usr/
    dst: /opt/snim/usr
    type: tree
  - src: /opt/snim/usr/bin/snim
    dst: /usr/bin/snim
    type: symlink
  - src: packaging/linux/dev.snim.Snim.desktop
    dst: /usr/share/applications/dev.snim.Snim.desktop
  - src: AppDir/usr/share/icons/hicolor/*/apps/dev.snim.Snim.*
    dst: /usr/share/icons/hicolor
  # A link rather than a copy, so packaging works whether or not the build installs metainfo.
  - src: /opt/snim/usr/share/metainfo/dev.snim.Snim.metainfo.xml
    dst: /usr/share/metainfo/dev.snim.Snim.metainfo.xml
    type: symlink
  - src: LICENSE
    dst: /usr/share/licenses/snim/LICENSE
    type: license
    packager: rpm
  - src: LICENSE
    dst: /usr/share/doc/snim/copyright
    packager: deb

# Every library the bundle links but does not carry (NEEDED entries missing from
# /opt/snim/usr/lib), glibc and the GCC runtime aside. glib, libwayland and GStreamer must be
# the host's: a bundled libwayland misses newer protocol events, and the dlopened modules
# bind the host's GStreamer and its plugins.
overrides:
  deb:
    depends:
      - libgl1
      - libglx0
      - libopengl0
      - libegl1
      - libfontconfig1
      - libfreetype6
      - libx11-6
      - libx11-xcb1
      - libxcb1
      # Session management, which the aarch64 Qt links into its xcb integration.
      - libsm6
      - libice6
      # For the bundled FFmpeg (libdrm), GnuTLS (gmp) and most of the rest (zlib).
      - libdrm2
      - libgmp10
      - zlib1g
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libglib2.0-0t64 | libglib2.0-0
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-base
      # Recording needs pipewiresrc (or ximagesrc on X11), videocrop and mp4mux; audio pulsesrc
      # and aacparse.
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pipewire
      # OpenH264's encoder and decoder, h264parse and voaacenc: enough to record with audio
      # and to trim.
      - gstreamer1.0-plugins-bad
      # The bundled libgcrypt and Kerberos.
      - libgpg-error0
      - libcom-err2
    recommends:
      # x264, the encoder Snim prefers, and FFmpeg's H.264 decoder and AAC encoder.
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-libav
      - xdg-desktop-portal
  rpm:
    depends:
      - libglvnd-glx
      - libglvnd-egl
      - libglvnd-opengl
      - fontconfig
      - freetype
      - libX11
      - libX11-xcb
      - libxcb
      - libSM
      - libICE
      - libdrm
      - gmp
      - zlib
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - glib2
      - gstreamer1
      - gstreamer1-plugins-base
      # videocrop, mp4mux and ximagesrc; audio pulsesrc and aacparse.
      - gstreamer1-plugins-good
      - pipewire-gstreamer
      # h264parse and fdkaacenc.
      - gstreamer1-plugins-bad-free
      # Stock Fedora's only H.264 encoder and decoder, from its default-on Cisco repository.
      - gstreamer1-plugin-openh264
      - libgpg-error
      - libcom_err
    recommends:
      # x264 from RPM Fusion; a weak dependency, so it is skipped where that is off.
      - gstreamer1-plugins-ugly
      - xdg-desktop-portal

rpm:
  compression: zstd
deb:
  # xz, not zstd: older dpkg releases cannot unpack zstd members.
  compression: xz
