name: Set up Qt (Windows)
description: Installs MSVC Qt with install-qt-action, cached between runs.
inputs:
  version:
    description: Qt version
    required: true
  modules:
    description: Qt add-on modules, space separated
    default: qtmultimedia qtimageformats
runs:
  using: composite
  steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.version }}
        arch: 'win64_msvc2022_64'
        modules: ${{ inputs.modules }}
        cache: true
        # aqtinstall 3.3.0 cannot read the Qt 6.11 Windows layout; drop once a later release ships.
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
