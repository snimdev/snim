name: Bug report
description: Something in Snim does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search the existing issues first; if one matches, add to it instead.

  - type: input
    id: version
    attributes:
      label: Snim version
      description: Tray menu, then About, or `snim --version`.
      placeholder: 1.0.0-rc.1
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: Fedora 44, Ubuntu 24.04, macOS 15.4, Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: desktop
    attributes:
      label: Desktop (Linux only)
      options:
        - Not on Linux
        - KDE Plasma
        - GNOME
        - Sway or another wlroots compositor
        - Hyprland
        - Cinnamon
        - Xfce
        - Other (say which below)

  - type: dropdown
    id: session
    attributes:
      label: Session type (Linux only)
      description: "`echo $XDG_SESSION_TYPE` prints it."
      options:
        - Not on Linux
        - Wayland
        - X11
        - Not sure

  - type: dropdown
    id: install
    attributes:
      label: How did you install Snim?
      options:
        - Flatpak
        - .deb package
        - .rpm package
        - install.sh or the portable tarball
        - DMG
        - Homebrew
        - Windows installer
        - Windows portable zip
        - Built from source
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include any error message Snim showed.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the tray menu
        2. Choose Capture Area
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        On Linux and macOS, start Snim from a terminal (`snim`, `flatpak run dev.snim.Snim` or `/Applications/Snim.app/Contents/MacOS/Snim`), reproduce the problem, then paste what it printed.
      render: text

  - type: textarea
    id: media
    attributes:
      label: Screenshots or recordings
      description: Drag files here if they help show the problem.
