name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: false
        default: '0.0.0-test'
      publish-flatpak-test:
        description: 'Publish the Flatpak into the scratch flatpak/test-repo on R2'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  linux-bundle:
    name: Linux bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      # One architecture failing must not cancel the other's build and hide its result.
      fail-fast: false
      matrix:
        include:
          # The oldest runner image still offered on purpose: the bundle runs only on
          # distributions whose glibc is at least as new as the one it was built against.
          # When GitHub retires ubuntu-22.04, do NOT simply bump this to a newer image or
          # the bundle stops working on older systems; move the build into a container
          # instead (`container: ubuntu:22.04` on the newest runner, plus sudo-less apt
          # and a manual git/ca-certificates install).
          - arch: x86_64
            runner: ubuntu-22.04
          # Qt's arm64 archives are built on Ubuntu 24.04 and need glibc 2.38, so an
          # older runner cannot even link against them; that is this build's glibc floor.
          - arch: aarch64
            runner: ubuntu-24.04-arm

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Install system dependencies
        run: |
          # The image's clang libunwind-14-dev conflicts with the libunwind-dev
          # that libgstreamer1.0-dev depends on; apt refuses the mix.
          sudo apt-get remove -y 'libunwind-*-dev' || true
          sudo apt-get update
          # The GStreamer runtime plugins below are for the test run only: nothing is
          # bundled any more, the recorder module is dlopened against the user's own.
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            tesseract-ocr \
            tesseract-ocr-eng \
            libtesseract-dev \
            libleptonica-dev \
            libwebp-dev \
            libgif-dev \
            libimagequant-dev \
            libcurl4-openssl-dev \
            libssh2-1-dev \
            extra-cmake-modules \
            libwayland-dev \
            wayland-protocols \
            meson \
            libffi-dev \
            libexpat1-dev \
            libxcb-cursor0 \
            libfuse2 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-pipewire

      - name: Build LayerShellQt
        # Not packaged for Qt 6 on Ubuntu 22.04, and without it the recording frame
        # overlay sinks below other windows on Wayland. v6.4.6 is the newest release
        # whose QT_MIN_VERSION is still 6.8; jammy's extra-cmake-modules is 5.92, far
        # below the ECM 6.14 it wants, so ECM is built from source alongside it.
        # Qt 6.11's Wayland headers need wl_fixes (Wayland 1.24) and clash with the system
        # header's include guard; build-time only, LayerShellQt calls nothing newer than 1.20.
        env:
          PREFIX: ${{ github.workspace }}/deps-prefix
          WAYLAND_PREFIX: ${{ github.workspace }}/wayland-prefix
        run: |
          git clone --depth 1 --branch 1.24.0 https://gitlab.freedesktop.org/wayland/wayland.git wayland-src
          meson setup wayland-build wayland-src --prefix="$WAYLAND_PREFIX" --libdir=lib \
            -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          ninja -C wayland-build install
          git clone --depth 1 --branch v6.14.0 https://invent.kde.org/frameworks/extra-cmake-modules.git ecm-src
          cmake -S ecm-src -B ecm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_TESTING=OFF
          cmake --install ecm-build
          git clone --depth 1 --branch v6.4.6 https://invent.kde.org/plasma/layer-shell-qt.git lsq-src
          PKG_CONFIG_PATH="$WAYLAND_PREFIX/lib/pkgconfig" cmake -S lsq-src -B lsq-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$PREFIX" \
            -DBUILD_TESTING=OFF
          cmake --build lsq-build
          cmake --install lsq-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSNIM_VERSION=${{ steps.version.outputs.version }}
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;${{ github.workspace }}/deps-prefix"

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --output-on-failure --timeout 120

      - name: Install into AppDir
        run: cmake --install build --prefix AppDir/usr

      - name: Stage tessdata
        # Ship eng in ../share/tessdata beside the binary, where OCR looks for it (BundledPaths).
        run: |
          mkdir -p AppDir/usr/share/tessdata
          cp /usr/share/tesseract-ocr/*/tessdata/eng.traineddata AppDir/usr/share/tessdata/

      - name: Fetch linuxdeploy
        # Pinned: linuxdeploy publishes rolling "continuous" builds, and an unpinned
        # tool is a build that changes under us.
        run: |
          LD_TAG=1-alpha-20240109-1
          curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LD_TAG/linuxdeploy-${{ matrix.arch }}.AppImage"
          curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/$LD_TAG/linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage"
          chmod +x linuxdeploy-${{ matrix.arch }}.AppImage linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage

      - name: Bundle Qt into the AppDir
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          # Wayland sessions need it; the qt plugin deploys only the xcb platform by default.
          EXTRA_PLATFORM_PLUGINS: "libqwayland.so"
          # linuxdeploy is itself an AppImage; this runs it without FUSE, which the image may lack.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          export PATH="$PWD:$PATH"
          # linuxdeploy resolves NEEDED libs via the linker path; the source-built
          # LayerShellQt lives in the workspace prefix, not a system dir.
          export LD_LIBRARY_PATH="${{ github.workspace }}/deps-prefix/lib:${{ github.workspace }}/deps-prefix/lib/${{ matrix.arch }}-linux-gnu:$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          # GStreamer stays host-provided, core libraries and plugins alike: a
          # pipewiresrc frozen at build time cannot track an evolving PipeWire daemon
          # (a 1.20 build fails on a 1.6 daemon with "error alloc buffers"). Only the
          # dlopened recorder module links it, so nothing here needs it at all. glib
          # goes with it: GStreamer is all glib, and a bundled 2.72 cannot satisfy a
          # host libgstreamer built against 2.88. The PipeWire client library stays
          # host-provided for the same reason, plus it dlopens SPA modules from its own
          # install prefix (a bundled copy means pw_loop_new fails and pipewiresrc
          # segfaults).
          #
          # The wayland platform plugin refuses to load without a shell integration, and
          # the pinned qt plugin deploys neither it nor the decorations, so they are
          # copied in by hand: --deploy-deps-only then pulls their libraries and fixes
          # their rpath without copying them again.
          for plugins in wayland-shell-integration wayland-decoration-client wayland-graphics-integration-client; do
            if [ ! -d "$QT_ROOT_DIR/plugins/$plugins" ]; then
              echo "::error title=Qt has no $plugins::$QT_ROOT_DIR/plugins/$plugins is missing, so the bundle could only ever run under XWayland"
              exit 1
            fi
            mkdir -p "AppDir/usr/plugins/$plugins"
            cp -a "$QT_ROOT_DIR/plugins/$plugins/." "AppDir/usr/plugins/$plugins/"
          done
          ./linuxdeploy-${{ matrix.arch }}.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/dev.snim.Snim.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/dev.snim.Snim.png \
            --deploy-deps-only AppDir/usr/plugins/wayland-shell-integration \
            --deploy-deps-only AppDir/usr/plugins/wayland-decoration-client \
            --deploy-deps-only AppDir/usr/plugins/wayland-graphics-integration-client \
            --exclude-library "libgst*" \
            --exclude-library "libglib-2.0.so*" \
            --exclude-library "libgthread-2.0.so*" \
            --exclude-library "libgobject-2.0.so*" \
            --exclude-library "libgmodule-2.0.so*" \
            --exclude-library "libgio-2.0.so*" \
            --exclude-library "libwayland-*.so*" \
            --exclude-library "libpipewire-0.3.so*" \
            --plugin qt
          # The qt plugin deploys Qt's own dependencies without honoring
          # --exclude-library, so glib comes back in through Qt6Core every time. It has
          # to go: the host's libgstreamer binds to whatever libglib is already loaded,
          # and a bundled 2.72 leaves a Fedora 2.88 libgstreamer full of undefined
          # symbols, which is a recorder module that will not dlopen.
          rm -f AppDir/usr/lib/libglib-2.0.so* AppDir/usr/lib/libgthread-2.0.so*
          test ! -e AppDir/usr/lib/libglib-2.0.so.0
          test ! -e AppDir/usr/lib/libgthread-2.0.so.0
          # libwayland goes the same way, and for a sharper reason: its interface tables
          # are the wire protocol. Qt 6.8 binds wl_compositor at version 6, so a modern
          # compositor sends wl_surface event 2 (preferred_buffer_scale, Wayland 1.22),
          # and a bundled 1.20 client has no such event: "interface 'wl_surface' has no
          # event 2" and the connection dies. The client has to be the host's.
          rm -f AppDir/usr/lib/libwayland-*.so*
          test ! -e AppDir/usr/lib/libwayland-client.so.0
          # A bundle without the xdg-shell integration is exactly what alpha.2 shipped:
          # the wayland plugin fails to load, the app runs under XWayland, and nothing
          # says so but a debug line.
          if [ ! -e AppDir/usr/plugins/wayland-shell-integration/libxdg-shell.so ]; then
            echo "::error title=No Wayland shell integration::AppDir/usr/plugins/wayland-shell-integration/libxdg-shell.so is missing, so the bundle would silently run under XWayland"
            ls -R AppDir/usr/plugins || true
            exit 1
          fi
          # The recorder and video modules leave their base classes (RecordingStrategy,
          # VideoExporter) undefined on purpose and bind them to snim at dlopen time.
          # Nothing fails at build time if the binary stops exporting those, recording or
          # trimming just degrades to the stub on every machine, so check the seam:
          # whatever a module borrows, snim exports.
          nm -D --defined-only AppDir/usr/bin/snim | awk '{print $NF}' | sort -u > exported.txt
          for name in libsnim-recorder-linux.so libsnim-video-linux.so; do
            module=$(find AppDir/usr -name "$name" -print -quit)
            test -n "$module" || { echo "::error title=No module $name::$name was not installed into the AppDir"; exit 1; }
            ldd -r "$module" 2>&1 | awk '/^undefined symbol:/ {print $3}' | sort -u > borrowed.txt
            comm -23 borrowed.txt exported.txt > unresolved.txt
            if [ -s unresolved.txt ]; then
              echo "::error title=$name will not dlopen::snim does not export the symbols below, so the module would fall back to the stub"
              cat unresolved.txt
              exit 1
            fi
          done

      - name: Pack the portable tarball
        # An extracted install lives at a stable path, which is the only thing KWin's
        # ScreenShot2 authorization can match against.
        run: tar -czf Snim-${{ matrix.arch }}.tar.gz -C AppDir .

      - name: Build the .deb and .rpm
        env:
          SNIM_VERSION: ${{ steps.version.outputs.version }}
          SNIM_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}
        # Pinned and checksum-verified; the sums come from the release's checksums.txt.
        # File names keep the hyphenated version, since GitHub may rewrite a ~ in asset names.
        run: |
          NFPM_VERSION=2.47.0
          case "${{ matrix.arch }}" in
            x86_64) NFPM_ASSET=x86_64; NFPM_SHA256=0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 ;;
            aarch64) NFPM_ASSET=arm64; NFPM_SHA256=1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c ;;
          esac
          curl -fsSLo nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_$NFPM_ASSET.tar.gz"
          echo "$NFPM_SHA256  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          ./nfpm package -f packaging/linux/nfpm.yaml -p deb -t "snim_${SNIM_VERSION}_${SNIM_ARCH}.deb"
          ./nfpm package -f packaging/linux/nfpm.yaml -p rpm -t "snim-${SNIM_VERSION}.${{ matrix.arch }}.rpm"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: |
            Snim-${{ matrix.arch }}.tar.gz
            snim_*.deb
            snim-*.rpm
          if-no-files-found: error

  portability:
    name: Install on ${{ matrix.image }} (${{ matrix.arch }})
    needs: [linux-bundle]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13', 'fedora:latest']
        # Below the aarch64 build's glibc 2.38 floor (see linux-bundle).
        exclude:
          - arch: aarch64
            image: ubuntu:22.04
          - arch: aarch64
            image: debian:12
        include:
          # No recommends or weak deps: the checks below must pass on the package's hard dependencies alone.
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y --no-install-recommends ./snim_*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y --no-install-recommends ./snim_*.deb
          - image: debian:12
            install: apt-get update && apt-get install -y --no-install-recommends ./snim_*.deb
          - image: debian:13
            install: apt-get update && apt-get install -y --no-install-recommends ./snim_*.deb
          - image: fedora:latest
            install: dnf install -y --setopt=install_weak_deps=False ./snim-*.rpm

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-${{ matrix.arch }}

      - name: Install the package
        run: ${{ matrix.install }}

      - name: Extract the tarball
        run: |
          mkdir -p /opt/snim-test
          tar -xzf Snim-${{ matrix.arch }}.tar.gz -C /opt/snim-test

      - name: Every library resolves
        # The recorder and video modules too: they are dlopened at runtime, so a NEEDED
        # library they miss would only surface when the user hits record or trims.
        run: |
          module=$(find /opt/snim/usr -name 'libsnim-recorder-linux.so' -print -quit)
          test -n "$module" || { echo "::error title=No recorder module::libsnim-recorder-linux.so is not in the package"; exit 1; }
          video_module=$(find /opt/snim/usr -name 'libsnim-video-linux.so' -print -quit)
          test -n "$video_module" || { echo "::error title=No video module::libsnim-video-linux.so is not in the package"; exit 1; }
          # No Qt on these images, so the shell integration resolving at all proves the
          # bundle's own rpath carries it. Without it Qt drops to XWayland in silence.
          shell_integration=/opt/snim/usr/plugins/wayland-shell-integration/libxdg-shell.so
          test -e "$shell_integration" || { echo "::error title=No Wayland shell integration::$shell_integration is not in the package"; exit 1; }
          # The platform plugin too: it is what binds wl_compositor, so its libwayland
          # has to be the host's or the connection dies on the first surface event a
          # newer compositor sends.
          wayland_platform=/opt/snim/usr/plugins/platforms/libqwayland.so
          test -e "$wayland_platform" || { echo "::error title=No Wayland platform plugin::$wayland_platform is not in the package"; exit 1; }
          for binary in /opt/snim/usr/bin/snim "$module" "$video_module" "$shell_integration" "$wayland_platform"; do
            # -r resolves symbols too: a bundled library that is too old for a host
            # one shows up as an undefined symbol, never as "not found".
            ldd -r "$binary" > ldd.txt 2>&1 || true
            echo "--- ldd -r $binary (${{ matrix.image }}) ---"
            cat ldd.txt
            # The modules leave their base classes undefined on purpose: those bind to
            # snim at dlopen time, and the build job proves that seam holds.
            grep -E 'not found|undefined symbol' ldd.txt \
              | grep -v -e 'Recording17RecordingStrategy' -e 'Video13VideoExporter' > unresolved.txt || true
            if [ -s unresolved.txt ]; then
              echo "::error title=Unresolved libraries or symbols on ${{ matrix.image }}::$binary does not fully resolve against this system"
              cat unresolved.txt
              exit 1
            fi
          done
          echo "All libraries resolved on ${{ matrix.image }}."

      - name: It starts and reports its version
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          EXPECTED="Snim ${{ needs.linux-bundle.outputs.version }}"
          # The packaged command, then the tarball's binary against the same host libraries.
          for binary in /usr/bin/snim /opt/snim-test/usr/bin/snim; do
            # Only stdout carries the version; Qt logs probe warnings to stderr, and a
            # bare container has no PipeWire for Qt Multimedia to find.
            if ! ACTUAL="$("$binary" --version 2>/tmp/snim-stderr.log)"; then
              echo "::error title=Startup failed on ${{ matrix.image }}::$binary --version exited non-zero"
              cat /tmp/snim-stderr.log
              exit 1
            fi
            cat /tmp/snim-stderr.log
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error title=Wrong version on ${{ matrix.image }}::$binary: expected '$EXPECTED', got '$ACTUAL'"
              exit 1
            fi
            echo "$binary: $ACTUAL started on ${{ matrix.image }}."
          done

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      # flatpak-builder sandboxes every build step with bubblewrap.
      options: --privileged

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the version into the manifest
        # flatpak-builder has no variables; the copy stays beside the original so `path: ../..` still resolves.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s|-DSNIM_VERSION=0.0.0-dev|-DSNIM_VERSION=$VERSION|" \
            packaging/flatpak/dev.snim.Snim.yml > packaging/flatpak/dev.snim.Snim.release.yml
          if ! grep -qF -- "-DSNIM_VERSION=$VERSION" packaging/flatpak/dev.snim.Snim.release.yml; then
            echo "::error title=Version not stamped::the manifest lost its -DSNIM_VERSION=0.0.0-dev placeholder"
            exit 1
          fi

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3  # v6.8
        with:
          manifest-path: packaging/flatpak/dev.snim.Snim.release.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/dev.snim.Snim.yml') }}
          # The bundle needs --repo-url, which the action cannot pass, so it is built below.
          build-bundle: false
          upload-artifact: false

      - name: It starts and reports its version
        env:
          EXPECTED: Snim ${{ steps.version.outputs.version }}
        run: |
          if ! ACTUAL="$(flatpak build --env=QT_QPA_PLATFORM=offscreen flatpak_app snim --version 2>/tmp/snim-stderr.log)"; then
            echo "::error title=Startup failed::snim --version exited non-zero in the Flatpak sandbox"
            cat /tmp/snim-stderr.log
            exit 1
          fi
          cat /tmp/snim-stderr.log
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error title=Wrong version::expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          echo "$ACTUAL started in the Flatpak sandbox."

      - name: It passes its self-test
        # The recorder line proves the runtime's GStreamer has every element the recorder needs.
        run: |
          if ! flatpak build --env=QT_QPA_PLATFORM=offscreen flatpak_app snim --self-test > /tmp/snim-self-test.txt 2>/tmp/snim-stderr.log; then
            cat /tmp/snim-self-test.txt /tmp/snim-stderr.log
            echo "::error title=Self-test failed::snim --self-test failed in the Flatpak sandbox"
            exit 1
          fi
          cat /tmp/snim-self-test.txt /tmp/snim-stderr.log
          if ! grep -q '^ok    recorder: ' /tmp/snim-self-test.txt; then
            echo "::error title=Recorder not checked::the self-test printed no recorder line"
            exit 1
          fi

      - name: Sign and bundle
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          DL_BASE_URL: ${{ vars.DL_BASE_URL }}
          # A manual run's bundle updates from the scratch repository it may be published to.
          REPO_NAME: ${{ github.event_name == 'push' && 'repo' || 'test-repo' }}
        run: |
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          bash scripts/flatpak-repo.sh bundle repo ${{ matrix.arch }} Snim-${{ matrix.arch }}.flatpak "$REPO_NAME"
          rm -rf "$GNUPGHOME"

      - uses: actions/upload-artifact@v6
        with:
          name: flatpak-${{ matrix.arch }}
          path: Snim-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  macos-dmg:
    name: DMG (macOS arm64)
    runs-on: ${{ vars.MACOS_RUNNER && fromJSON(vars.MACOS_RUNNER) || 'macos-15' }}
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALL_UPGRADE: 1   # a self-hosted Mac keeps its own versions
      HOMEBREW_NO_ANALYTICS: 1

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: brew install qt tesseract webp giflib libimagequant ninja cmake

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSNIM_VERSION=${{ steps.version.outputs.version }}
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: |
          export QT_QPA_PLATFORM=offscreen
          export TESSDATA_PREFIX="$(brew --prefix)/share/tessdata"
          ctest --output-on-failure --timeout 120

      - name: Deploy the bundle
        # macos_deploy.sh bundles Qt + tessdata, fixes rpaths and ad-hoc signs.
        run: cmake --build build --target deploy

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dmg-root
          cp -R build/dist/Snim.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Snim -srcfolder dmg-root -ov -format UDZO "Snim-$VERSION-macos-arm64.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: dmg
          path: Snim-*-macos-arm64.dmg
          if-no-files-found: error

  windows:
    name: Installer and zip (Windows x64)
    # Off until a Windows runner exists: setting the WINDOWS_RUNNER repo variable turns it on.
    if: vars.WINDOWS_RUNNER != ''
    runs-on: ${{ vars.WINDOWS_RUNNER && fromJSON(vars.WINDOWS_RUNNER) || 'windows-2022' }}
    timeout-minutes: 120  # a cold vcpkg cache builds every dependency, FFmpeg included

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT -eq 'push') { $version = $env:GITHUB_REF_NAME -replace '^v', '' } else { $version = $env:INPUT_VERSION }
          # The installer's file version takes numbers only, so 1.0.0-alpha.9 stamps 1.0.0.
          if ($version -notmatch '^(\d+\.\d+\.\d+)') {
            Write-Output "::error title=Unusable version::'$version' does not start with X.Y.Z"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Set up MSVC
        uses: snimdev/setup-msvc@a587ffc345ba125d37f7b210f4a520917730ec5a  # v1.0.0

      - name: Set up Qt
        uses: ./.github/actions/setup-qt-windows
        with:
          version: '6.11.2'

      - name: Set up vcpkg
        id: vcpkg
        # Same pinning and cache key as the CI job, so a release reuses its packages.
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          $root = "$env:RUNNER_TEMP\vcpkg"
          git init --quiet $root
          git -C $root fetch --quiet --depth 1 https://github.com/microsoft/vcpkg $baseline
          git -C $root checkout --quiet FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($env:RUNNER_ENVIRONMENT -eq 'self-hosted') {
            # A persistent local cache (see scripts/windows-runner-bootstrap.ps1) replaces actions/cache.
            $cache = if ($env:SNIM_VCPKG_CACHE) { $env:SNIM_VCPKG_CACHE } else { 'C:\snim-ci\vcpkg-cache' }
            # Source archives too, so a package rebuild skips the download.
            $downloads = if ($env:SNIM_VCPKG_DOWNLOADS) { $env:SNIM_VCPKG_DOWNLOADS } else { 'C:\snim-ci\vcpkg-downloads' }
            New-Item -ItemType Directory -Force $downloads | Out-Null
            "VCPKG_DOWNLOADS=$downloads" >> $env:GITHUB_ENV
          } else {
            $cache = "$env:RUNNER_TEMP\vcpkg-cache"
          }
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "cache=$cache" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg packages
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v5
        with:
          path: ${{ steps.vcpkg.outputs.cache }}
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: >
          cmake --preset windows-msvc
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DSNIM_VERSION="${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build --preset windows-msvc

      - name: Test
        working-directory: build
        # Windows has no rpath: the tests find Qt and the vcpkg DLLs through PATH.
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$pwd\vcpkg_installed\x64-windows-snim\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --output-on-failure --timeout 120

      - name: Install into a stage
        id: stage
        run: |
          $stage = "$env:RUNNER_TEMP\stage"
          cmake --install build --prefix $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "dir=$stage" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMERIC: ${{ steps.version.outputs.numeric }}
          STAGE: ${{ steps.stage.outputs.dir }}
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc -and $env:RUNNER_ENVIRONMENT -eq 'self-hosted') {
            Write-Output "::error title=No Inno Setup::ISCC.exe is not installed on this self-hosted runner; run scripts/windows-runner-bootstrap.ps1 on it"
            exit 1
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            Write-Output "::error title=No Inno Setup::ISCC.exe is neither preinstalled nor installable"
            exit 1
          }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DAppVersionNumeric=$env:NUMERIC" "/DSourceDir=$env:STAGE" "/O$pwd\dist" packaging\windows\snim.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack the portable zip
        # An empty snim.ini beside snim.exe switches Snim to keeping its settings there.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          STAGE: ${{ steps.stage.outputs.dir }}
        run: |
          $root = "$env:RUNNER_TEMP\zip\Snim"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item -Recurse "$env:STAGE\*" $root
          New-Item -ItemType File "$root\snim.ini" | Out-Null
          # Windows' own bsdtar, since .NET's zip writer can store backslash paths.
          & "$env:SystemRoot\System32\tar.exe" -a -c -f "dist\Snim-$env:VERSION-windows-x64.zip" -C "$env:RUNNER_TEMP\zip" Snim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test a silent install
        timeout-minutes: 10
        # Only System32 on PATH and no Qt variables, so anything missing from the installed
        # bundle fails here. snim.exe is a GUI exe whose stdout PowerShell never captures,
        # hence the explicit redirects.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $dir = "$env:RUNNER_TEMP\installed"
          $p = Start-Process "$pwd\dist\Snim-$env:VERSION-windows-x64-setup.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) {
            Write-Output "::error title=Setup failed::the silent install exited with $($p.ExitCode)"
            exit 1
          }
          $out = "$env:RUNNER_TEMP\installed-self-test.txt"
          $p = Start-Process "$dir\snim.exe" -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          if ($p.ExitCode -ne 0) {
            Write-Output "::error title=Installed self-test failed::snim.exe --self-test exited with $($p.ExitCode)"
            exit 1
          }
          $out = "$env:RUNNER_TEMP\installed-version.txt"
          $p = Start-Process "$dir\snim.exe" -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          $actual = (Get-Content $out -Raw).TrimEnd("`r", "`n")
          if ($p.ExitCode -ne 0 -or $actual -cne "Snim $env:VERSION") {
            Write-Output "::error title=Wrong version::expected 'Snim $env:VERSION', got '$actual' (exit $($p.ExitCode))"
            exit 1
          }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Output "::error title=Uninstall failed::unins000.exe exited with $($p.ExitCode)"
            exit 1
          }
          # The uninstaller hands off to a copy of itself in %TEMP% and returns early.
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) {
            Write-Output "::error title=Uninstall left files behind::$dir still exists"
            Get-ChildItem -Recurse -Force $dir | ForEach-Object FullName
            exit 1
          }
          Write-Output "$actual installed, passed its self-test and uninstalled cleanly."

      - name: Smoke-test the portable zip
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $root = "$env:RUNNER_TEMP\unzipped"
          Expand-Archive "dist\Snim-$env:VERSION-windows-x64.zip" $root
          if (-not (Test-Path "$root\Snim\snim.ini")) {
            Write-Output "::error title=Zip is not portable::Snim\snim.ini is missing from the zip"
            exit 1
          }
          $env:PATH = "$env:SystemRoot\System32"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $out = "$env:RUNNER_TEMP\zip-self-test.txt"
          $p = Start-Process "$root\Snim\snim.exe" -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          exit $p.ExitCode

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            dist/Snim-*-windows-x64-setup.exe
            dist/Snim-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [linux-bundle, flatpak, macos-dmg, portability, windows]
    # workflow_dispatch builds the artifacts but never publishes a release. A skipped
    # Windows job (no runner configured) still ships Linux and macOS.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.linux-bundle.result == 'success' && needs.macos-dmg.result == 'success' &&
      needs.portability.result == 'success' && needs.flatpak.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.windows.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        run: bash scripts/changelog.sh "$GITHUB_REF_NAME" > notes.md

      - name: Write checksums
        # The install script verifies its download against this before touching $HOME.
        working-directory: artifacts
        run: sha256sum Snim-* snim_*.deb snim-*.rpm > sha256sums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS=(--title "Snim $VERSION" --notes-file notes.md)
          # A hyphen in the version means a prerelease tag (v1.0.0-alpha.1), so flag it as one.
          case "$VERSION" in
            *-*) FLAGS+=(--prerelease) ;;
          esac
          FILES=(
            "artifacts/Snim-x86_64.tar.gz"
            "artifacts/snim_${VERSION}_amd64.deb"
            "artifacts/snim-$VERSION.x86_64.rpm"
            "artifacts/Snim-x86_64.flatpak"
            "artifacts/Snim-aarch64.tar.gz"
            "artifacts/snim_${VERSION}_arm64.deb"
            "artifacts/snim-$VERSION.aarch64.rpm"
            "artifacts/Snim-aarch64.flatpak"
            "artifacts/Snim-$VERSION-macos-arm64.dmg"
          )
          if [ "$WINDOWS_RESULT" = success ]; then
            FILES+=(
              "artifacts/Snim-$VERSION-windows-x64-setup.exe"
              "artifacts/Snim-$VERSION-windows-x64.zip"
            )
          fi
          gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}" "${FILES[@]}" "artifacts/sha256sums.txt"

  flatpak-repo:
    name: Publish the Flatpak repository
    needs: [release, flatpak]
    # A tag publishes the live repo after its GitHub release; a manual run touches only
    # flatpak/test-repo, and only when publish-flatpak-test is ticked.
    if: >-
      !cancelled() && needs.flatpak.result == 'success' && (
        (github.event_name == 'push' && needs.release.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish-flatpak-test)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Two interleaved publishes would each upload a summary missing the other's commit.
    concurrency:
      group: flatpak-repo
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Install flatpak, ostree and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree rclone

      - uses: actions/download-artifact@v7
        with:
          pattern: flatpak-*
          path: bundles
          merge-multiple: true

      - name: Publish
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          DL_BASE_URL: ${{ vars.DL_BASE_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          REPO_NAME: ${{ github.event_name == 'push' && 'repo' || 'test-repo' }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # The token is scoped to one bucket and may not list or create buckets.
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "::error title=No bucket::the R2_BUCKET repository variable is not set"
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          bash scripts/flatpak-repo.sh publish "r2:$R2_BUCKET/flatpak" "$REPO_NAME" \
            bundles/Snim-x86_64.flatpak bundles/Snim-aarch64.flatpak
          rm -rf "$GNUPGHOME"
