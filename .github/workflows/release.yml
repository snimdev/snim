name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: false
        default: '0.0.0-test'

permissions:
  contents: write

jobs:
  linux-appimage:
    name: AppImage (Linux x86_64)
    # The oldest runner image still offered on purpose: an AppImage runs only on
    # distributions whose glibc is at least as new as the one it was built against.
    # When GitHub retires ubuntu-22.04, do NOT simply bump this to a newer image or
    # the AppImage stops working on older systems; move the build into a container
    # instead (`container: ubuntu:22.04` on the newest runner, plus sudo-less apt
    # and a manual git/ca-certificates install).
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 90

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A hyphen means a prerelease, and those update from the rolling alpha release;
          # anything else follows GitHub's own "latest", which skips prereleases.
          case "$VERSION" in
            *-*) echo "channel=alpha" >> "$GITHUB_OUTPUT" ;;
            *) echo "channel=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Install system dependencies
        run: |
          # The image's clang libunwind-14-dev conflicts with the libunwind-dev
          # that libgstreamer1.0-dev depends on; apt refuses the mix.
          sudo apt-get remove -y 'libunwind-*-dev' || true
          sudo apt-get update
          # The GStreamer runtime plugins below are for the test run only: nothing is
          # bundled any more, the recorder module is dlopened against the user's own.
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            tesseract-ocr \
            tesseract-ocr-eng \
            libtesseract-dev \
            libleptonica-dev \
            libcurl4-openssl-dev \
            libssh2-1-dev \
            extra-cmake-modules \
            libwayland-dev \
            wayland-protocols \
            libxcb-cursor0 \
            libfuse2 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-pipewire

      - name: Build LayerShellQt
        # Not packaged for Qt 6 on Ubuntu 22.04, and without it the recording frame
        # overlay sinks below other windows on Wayland. v6.4.6 is the newest release
        # whose QT_MIN_VERSION is still 6.8; jammy's extra-cmake-modules is 5.92, far
        # below the ECM 6.14 it wants, so ECM is built from source alongside it.
        env:
          PREFIX: ${{ github.workspace }}/deps-prefix
        run: |
          git clone --depth 1 --branch v6.14.0 https://invent.kde.org/frameworks/extra-cmake-modules.git ecm-src
          cmake -S ecm-src -B ecm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_TESTING=OFF
          cmake --install ecm-build
          git clone --depth 1 --branch v6.4.6 https://invent.kde.org/plasma/layer-shell-qt.git lsq-src
          cmake -S lsq-src -B lsq-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$PREFIX" \
            -DBUILD_TESTING=OFF
          cmake --build lsq-build
          cmake --install lsq-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSNIM_VERSION=${{ steps.version.outputs.version }}
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;${{ github.workspace }}/deps-prefix"

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --output-on-failure --timeout 120

      - name: Install into AppDir
        run: cmake --install build --prefix AppDir/usr

      - name: Stage tessdata
        # Tesseract finds no language pack inside an AppImage, so ship eng and point
        # TESSDATA_PREFIX at it from an AppRun hook before the binary starts.
        run: |
          mkdir -p AppDir/usr/share/tessdata
          cp /usr/share/tesseract-ocr/*/tessdata/eng.traineddata AppDir/usr/share/tessdata/
          mkdir -p AppDir/apprun-hooks
          cat > AppDir/apprun-hooks/tessdata.sh <<'HOOK'
          export TESSDATA_PREFIX="$APPDIR/usr/share/tessdata"
          HOOK

      - name: Fetch linuxdeploy
        # Pinned: linuxdeploy publishes rolling "continuous" builds, and an unpinned
        # tool is a build that changes under us.
        run: |
          LD_TAG=1-alpha-20240109-1
          curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LD_TAG/linuxdeploy-x86_64.AppImage"
          curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/$LD_TAG/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          # Wayland sessions need these; the qt plugin deploys only the xcb platform by default.
          EXTRA_PLATFORM_PLUGINS: "libqwayland-generic.so;libqwayland-egl.so"
          VERSION: ${{ steps.version.outputs.version }}
          OUTPUT: Snim-x86_64.AppImage
          # Lets AppImageUpdate pull the next release without a reinstall. The channel is
          # baked in for good: an alpha build follows the rolling `alpha` release, a stable
          # one follows `latest`, so installing a stable build switches channels.
          UPDATE_INFORMATION: "gh-releases-zsync|snimdev|snim|${{ steps.version.outputs.channel }}|Snim-x86_64.AppImage.zsync"
        run: |
          export PATH="$PWD:$PATH"
          # linuxdeploy resolves NEEDED libs via the linker path; the source-built
          # LayerShellQt lives in the workspace prefix, not a system dir.
          export LD_LIBRARY_PATH="${{ github.workspace }}/deps-prefix/lib:${{ github.workspace }}/deps-prefix/lib/x86_64-linux-gnu:$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          # GStreamer stays host-provided, core libraries and plugins alike: a
          # pipewiresrc frozen at build time cannot track an evolving PipeWire daemon
          # (a 1.20 build fails on a 1.6 daemon with "error alloc buffers"). Only the
          # dlopened recorder module links it, so nothing here needs it at all. glib
          # goes with it: GStreamer is all glib, and a bundled 2.72 cannot satisfy a
          # host libgstreamer built against 2.88. The PipeWire client library stays
          # host-provided for the same reason, plus it dlopens SPA modules from its own
          # install prefix (a bundled copy means pw_loop_new fails and pipewiresrc
          # segfaults). Deploy and package are separate passes so the checks below land
          # before squashing.
          #
          # The wayland platform plugin refuses to load without a shell integration, and
          # the pinned qt plugin deploys neither it nor the decorations, so they are
          # copied in by hand: --deploy-deps-only then pulls their libraries and fixes
          # their rpath without copying them again.
          for plugins in wayland-shell-integration wayland-decoration-client wayland-graphics-integration-client; do
            if [ ! -d "$QT_ROOT_DIR/plugins/$plugins" ]; then
              echo "::error title=Qt has no $plugins::$QT_ROOT_DIR/plugins/$plugins is missing, so the bundle could only ever run under XWayland"
              exit 1
            fi
            mkdir -p "AppDir/usr/plugins/$plugins"
            cp -a "$QT_ROOT_DIR/plugins/$plugins/." "AppDir/usr/plugins/$plugins/"
          done
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/dev.snim.Snim.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/dev.snim.Snim.png \
            --deploy-deps-only AppDir/usr/plugins/wayland-shell-integration \
            --deploy-deps-only AppDir/usr/plugins/wayland-decoration-client \
            --deploy-deps-only AppDir/usr/plugins/wayland-graphics-integration-client \
            --exclude-library "libgst*" \
            --exclude-library "libglib-2.0.so*" \
            --exclude-library "libgthread-2.0.so*" \
            --exclude-library "libgobject-2.0.so*" \
            --exclude-library "libgmodule-2.0.so*" \
            --exclude-library "libgio-2.0.so*" \
            --exclude-library "libpipewire-0.3.so*" \
            --plugin qt
          # The qt plugin deploys Qt's own dependencies without honoring
          # --exclude-library, so glib comes back in through Qt6Core every time. It has
          # to go: the host's libgstreamer binds to whatever libglib is already loaded,
          # and a bundled 2.72 leaves a Fedora 2.88 libgstreamer full of undefined
          # symbols, which is a recorder module that will not dlopen.
          rm -f AppDir/usr/lib/libglib-2.0.so* AppDir/usr/lib/libgthread-2.0.so*
          test ! -e AppDir/usr/lib/libglib-2.0.so.0
          test ! -e AppDir/usr/lib/libgthread-2.0.so.0
          # A bundle without the xdg-shell integration is exactly what alpha.2 shipped:
          # the wayland plugin fails to load, the app runs under XWayland, and nothing
          # says so but a debug line.
          if [ ! -e AppDir/usr/plugins/wayland-shell-integration/libxdg-shell.so ]; then
            echo "::error title=No Wayland shell integration::AppDir/usr/plugins/wayland-shell-integration/libxdg-shell.so is missing, so the AppImage would silently run under XWayland"
            ls -R AppDir/usr/plugins || true
            exit 1
          fi
          # The recorder module leaves its RecordingStrategy base class undefined on
          # purpose and binds it to snim at dlopen time. Nothing fails at build time if
          # the binary stops exporting those, recording just degrades to the stub on
          # every machine, so check the seam: whatever the module borrows, snim exports.
          module=$(find AppDir/usr -name 'libsnim-recorder-linux.so' -print -quit)
          test -n "$module" || { echo "::error title=No recorder module::libsnim-recorder-linux.so was not installed into the AppDir"; exit 1; }
          nm -D --defined-only AppDir/usr/bin/snim | awk '{print $NF}' | sort -u > exported.txt
          ldd -r "$module" 2>&1 | awk '/^undefined symbol:/ {print $3}' | sort -u > borrowed.txt
          comm -23 borrowed.txt exported.txt > unresolved.txt
          if [ -s unresolved.txt ]; then
            echo "::error title=The recorder module will not dlopen::snim does not export the symbols below, so recording would fall back to the stub"
            cat unresolved.txt
            exit 1
          fi
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --exclude-library "libgst*" \
            --exclude-library "libglib-2.0.so*" \
            --exclude-library "libgthread-2.0.so*" \
            --exclude-library "libgobject-2.0.so*" \
            --exclude-library "libgmodule-2.0.so*" \
            --exclude-library "libgio-2.0.so*" \
            --exclude-library "libpipewire-0.3.so*" \
            --output appimage
          # Nothing may have put glib back while packaging: the tarball is this AppDir.
          test ! -e AppDir/usr/lib/libglib-2.0.so.0

      - name: Pack the portable tarball
        # The same AppDir, unsquashed: an extracted install lives at a stable path, which
        # is the only thing KWin's ScreenShot2 authorization can match against.
        run: tar -czf Snim-x86_64.tar.gz -C AppDir .

      - uses: actions/upload-artifact@v5
        with:
          name: appimage
          # Never renamed: the zsync file and UPDATE_INFORMATION both name this exact file.
          path: |
            Snim-x86_64.AppImage
            Snim-x86_64.AppImage.zsync
            Snim-x86_64.tar.gz
          if-no-files-found: error

  portability:
    name: Portable tarball (${{ matrix.image }})
    needs: [linux-appimage]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: ${{ matrix.image }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Exactly the libraries the AppImage excludelist leaves to the host (linuxdeploy
          # bundles everything else), so this list is the whole contract a target must meet:
          # GLVND, fontconfig, harfbuzz and libwayland-client. The base images already carry
          # the rest of the excludelist (libstdc++, libz, libexpat, libcom_err, libgmp, ...).
          # glib and GStreamer joined that contract when the bundle stopped carrying them:
          # Qt needs glib, and the dlopened recorder needs the host's own GStreamer, whose
          # pipeline elements (videocrop, videoconvert, capsfilter, valve) live in
          # plugins-base. glib is listed even though GStreamer pulls it in, because the
          # app must still start on a machine that has no GStreamer at all.
          - image: ubuntu:22.04
            setup: apt-get update && apt-get install -y --no-install-recommends libgl1 libopengl0 libegl1 libfontconfig1 libharfbuzz0b libwayland-client0 libglib2.0-0 libgstreamer1.0-0 gstreamer1.0-plugins-base
          - image: ubuntu:24.04
            setup: apt-get update && apt-get install -y --no-install-recommends libgl1 libopengl0 libegl1 libfontconfig1 libharfbuzz0b libwayland-client0 libglib2.0-0 libgstreamer1.0-0 gstreamer1.0-plugins-base
          - image: debian:12
            setup: apt-get update && apt-get install -y --no-install-recommends libgl1 libopengl0 libegl1 libfontconfig1 libharfbuzz0b libwayland-client0 libglib2.0-0 libgstreamer1.0-0 gstreamer1.0-plugins-base
          - image: fedora:latest
            setup: dnf install -y libglvnd-glx libglvnd-egl libglvnd-opengl fontconfig libwayland-client glib2 gstreamer1 gstreamer1-plugins-base

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: appimage

      - name: Install the host libraries
        run: ${{ matrix.setup }}

      - name: Extract the tarball
        run: |
          mkdir -p /opt/snim-test
          tar -xzf Snim-x86_64.tar.gz -C /opt/snim-test

      - name: Every library resolves
        # The recorder module too: it is dlopened at runtime, so a NEEDED library it
        # misses would only surface when the user hits record.
        run: |
          module=$(find /opt/snim-test/usr -name 'libsnim-recorder-linux.so' -print -quit)
          test -n "$module" || { echo "::error title=No recorder module::libsnim-recorder-linux.so is not in the tarball"; exit 1; }
          # No Qt on these images, so the shell integration resolving at all proves the
          # bundle's own rpath carries it. Without it Qt drops to XWayland in silence.
          shell_integration=/opt/snim-test/usr/plugins/wayland-shell-integration/libxdg-shell.so
          test -e "$shell_integration" || { echo "::error title=No Wayland shell integration::$shell_integration is not in the tarball"; exit 1; }
          for binary in /opt/snim-test/usr/bin/snim "$module" "$shell_integration"; do
            # -r resolves symbols too: a bundled library that is too old for a host
            # one shows up as an undefined symbol, never as "not found".
            ldd -r "$binary" > ldd.txt 2>&1 || true
            echo "--- ldd -r $binary (${{ matrix.image }}) ---"
            cat ldd.txt
            # The module leaves Recording::RecordingStrategy undefined on purpose: those
            # bind to snim at dlopen time, and the build job proves that seam holds.
            grep -E 'not found|undefined symbol' ldd.txt \
              | grep -v 'Recording17RecordingStrategy' > unresolved.txt || true
            if [ -s unresolved.txt ]; then
              echo "::error title=Unresolved libraries or symbols on ${{ matrix.image }}::$binary does not fully resolve against this system"
              cat unresolved.txt
              exit 1
            fi
          done
          echo "All libraries resolved on ${{ matrix.image }}."

      - name: It starts and reports its version
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          EXPECTED="Snim ${{ needs.linux-appimage.outputs.version }}"
          # Only stdout carries the version; Qt logs probe warnings to stderr, and a
          # bare container has no PipeWire for Qt Multimedia to find.
          if ! ACTUAL="$(/opt/snim-test/usr/bin/snim --version 2>/tmp/snim-stderr.log)"; then
            echo "::error title=Startup failed on ${{ matrix.image }}::snim --version exited non-zero"
            cat /tmp/snim-stderr.log
            exit 1
          fi
          cat /tmp/snim-stderr.log
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error title=Wrong version on ${{ matrix.image }}::expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          echo "$ACTUAL started on ${{ matrix.image }}."

  macos-dmg:
    name: DMG (macOS arm64)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: brew install qt tesseract ninja cmake

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSNIM_VERSION=${{ steps.version.outputs.version }}
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: |
          export QT_QPA_PLATFORM=offscreen
          export TESSDATA_PREFIX="$(brew --prefix)/share/tessdata"
          ctest --output-on-failure --timeout 120

      - name: Deploy the bundle
        # macos_deploy.sh bundles Qt + tessdata, fixes rpaths and ad-hoc signs.
        run: cmake --build build --target deploy

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dmg-root
          cp -R build/dist/Snim.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Snim -srcfolder dmg-root -ov -format UDZO "Snim-$VERSION-macos-arm64.dmg"

      - uses: actions/upload-artifact@v5
        with:
          name: dmg
          path: Snim-*-macos-arm64.dmg
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [linux-appimage, macos-dmg, portability]
    # workflow_dispatch builds the artifacts but never publishes a release.
    if: github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        run: bash scripts/changelog.sh "$GITHUB_REF_NAME" > notes.md

      - name: Write checksums
        # The install script verifies the AppImage against this before touching $HOME.
        working-directory: artifacts
        run: sha256sum Snim-* > sha256sums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS=(--title "Snim $VERSION" --notes-file notes.md)
          # A hyphen in the version means a prerelease tag (v1.0.0-alpha.1), so flag it as one.
          case "$VERSION" in
            *-*) FLAGS+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}" \
            "artifacts/Snim-x86_64.AppImage" \
            "artifacts/Snim-x86_64.AppImage.zsync" \
            "artifacts/Snim-x86_64.tar.gz" \
            "artifacts/Snim-$VERSION-macos-arm64.dmg" \
            "artifacts/sha256sums.txt"

      - name: Refresh the rolling alpha release
        # The tag must stay literally `alpha`: it is baked into every alpha AppImage's
        # UPDATE_INFORMATION, so AppImageUpdate looks it up by that name forever.
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(printf '%s\n\n%s\n' \
            "Rolling pointer to the newest alpha build, so AppImageUpdate has one stable zsync URL to follow. The AppImage here is replaced by every new alpha." \
            "Release notes live on the versioned prerelease: https://github.com/snimdev/snim/releases/tag/$GITHUB_REF_NAME")"
          # Only the Linux artifacts: the DMG has no zsync mechanism, so it stays on the
          # versioned release alone.
          gh release delete alpha --yes --cleanup-tag || true
          gh release create alpha \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Snim alpha channel" \
            --notes "$NOTES" \
            "artifacts/Snim-x86_64.AppImage" \
            "artifacts/Snim-x86_64.AppImage.zsync"
