name: CI

on:
  # Branches are covered by their pull request; an unfiltered push: would run the
  # whole matrix a second time for every PR commit.
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push supersedes the one still going. Never cancel on main,
# where each run is the record for a merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: blacksmith-6vcpu-macos-15   # Apple Silicon, matches the /opt/homebrew dev environment
    timeout-minutes: 30  # backstop so a hung step can't run to the 6h default

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        # qt6 + tesseract (OCR) + webp (animated WebP export) + ninja/cmake. cmake is
        # pinned via brew so it satisfies the project's cmake_minimum_required.
        run: brew install qt tesseract webp ninja cmake

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: |
          export QT_QPA_PLATFORM=offscreen
          export TESSDATA_PREFIX="$(brew --prefix)/share/tessdata"
          # --timeout kills a hung test's process tree instead of leaving it orphaned
          ctest --output-on-failure --timeout 120

      - name: Verify the bundle is self-contained
        # macos_deploy.sh otherwise runs for the first time during a release, so a
        # bundling break would surface there. Main only, to keep it off every PR.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cmake --build build --target deploy

  linux:
    name: Build & test (Linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30  # backstop so a hung step can't run to the 6h default

    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        # Ubuntu 24.04's apt Qt is 6.4, below the project's 6.5 minimum
        # (permission API), so Qt comes from the online archives instead.
        # qtimageformats ships the Qt WebP reader the tests read their output back with.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Install system dependencies
        # tesseract (OCR) + webp (animated WebP export) + ninja + GL/GStreamer headers.
        # cmake is not installed from apt: the runner image ships a newer one that
        # satisfies cmake_minimum_required.
        run: >
          sudo apt-get update && sudo apt-get install -y
          ninja-build
          libgl1-mesa-dev
          libgstreamer1.0-dev
          tesseract-ocr
          libtesseract-dev
          libleptonica-dev
          libwebp-dev

      - name: Install video decoding dependencies
        # tst_videoframegrabber decodes a real clip through Qt Multimedia, which uses
        # either the FFmpeg or the GStreamer backend depending on how Qt was built.
        # Both sets are installed so the test exercises the grabber instead of skipping
        # it for want of a decoder. Nothing here is a runtime dependency of the app: the
        # same backends ship with Qt in the released bundles.
        run: >
          sudo apt-get install -y
          libavcodec-dev
          libavformat-dev
          libswscale-dev
          gstreamer1.0-plugins-good
          gstreamer1.0-plugins-bad
          gstreamer1.0-libav

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: |
          export QT_QPA_PLATFORM=offscreen
          # --timeout kills a hung test's process tree instead of leaving it orphaned
          ctest --output-on-failure --timeout 120
