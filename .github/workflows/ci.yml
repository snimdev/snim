name: CI

on:
  # Branches are covered by their pull request; an unfiltered push: would run the
  # whole matrix a second time for every PR commit.
  push:
    branches: [main]
  # ready_for_review: drafts skip CI, so marking one ready is what first tests it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One run per ref: a new push supersedes the one still going. Never cancel on main,
# where each run is the record for a merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build & test (macOS)
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: blacksmith-6vcpu-macos-15   # Apple Silicon, matches the /opt/homebrew dev environment
    timeout-minutes: 30  # backstop so a hung step can't run to the 6h default

    # brew install runs a full brew update first unless told not to, which is most
    # of this job's dependency step.
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
      # Set explicitly: ccache's default cache location differs between versions.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        # qt6 + tesseract (OCR) + webp, giflib, libimagequant (animation export) +
        # ninja/cmake. cmake is pinned via brew so it satisfies cmake_minimum_required.
        run: brew install qt tesseract webp giflib libimagequant ninja cmake ccache

      - name: Restore the ccache
        # Compilation only: linking the test binaries is never cached. Restore here but
        # save only on main (below), so a pull request downloads the cache and never
        # spends time uploading a near-identical copy of it.
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: ccache stats
        run: ccache -s

      - name: Save the ccache
        # Only main refreshes it, so pull requests stay download-only.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Test
        working-directory: build
        run: |
          export QT_QPA_PLATFORM=offscreen
          export TESSDATA_PREFIX="$(brew --prefix)/share/tessdata"
          # --timeout kills a hung test's process tree instead of leaving it orphaned
          ctest --output-on-failure --timeout 120

      - name: Verify the bundle is self-contained
        # macos_deploy.sh otherwise runs for the first time during a release, so a
        # bundling break would surface there. Main only, to keep it off every PR.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cmake --build build --target deploy

  linux:
    name: Build & test (Linux)
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30  # backstop so a hung step can't run to the 6h default

    env:
      # Set explicitly: ccache's default cache location differs between versions.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        # Ubuntu 24.04's apt Qt is 6.4, below the project's 6.5 minimum
        # (permission API), so Qt comes from the online archives instead.
        # qtimageformats ships the Qt WebP reader the tests read their output back with.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Install system dependencies
        # tesseract (OCR) + webp, giflib, libimagequant (animation export) + ninja + ccache +
        # GL/GStreamer headers.
        # cmake is not installed from apt: the runner image ships a newer one that
        # satisfies cmake_minimum_required.
        #
        # tst_videoframegrabber decodes a real clip through Qt Multimedia, which uses
        # either the FFmpeg or the GStreamer backend depending on how Qt was built.
        # Both sets are installed so the test exercises the grabber instead of skipping
        # it for want of a decoder. Nothing here is a runtime dependency of the app: the
        # same backends ship with Qt in the released bundles. plugins-ugly carries x264enc,
        # so tst_gstvideoexporter trims for real instead of skipping.
        run: >
          sudo apt-get update && sudo apt-get install -y
          ninja-build
          ccache
          libgl1-mesa-dev
          libgstreamer1.0-dev
          tesseract-ocr
          libtesseract-dev
          libleptonica-dev
          libwebp-dev
          libgif-dev
          libimagequant-dev
          libavcodec-dev
          libavformat-dev
          libswscale-dev
          gstreamer1.0-plugins-good
          gstreamer1.0-plugins-bad
          gstreamer1.0-plugins-ugly
          gstreamer1.0-libav

      - name: Restore the ccache
        # Compilation only: linking the test binaries is never cached. Restore here but
        # save only on main (below), so a pull request downloads the cache and never
        # spends time uploading a near-identical copy of it.
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: ccache stats
        run: ccache -s

      - name: Save the ccache
        # Only main refreshes it, so pull requests stay download-only.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Test
        working-directory: build
        run: |
          export QT_QPA_PLATFORM=offscreen
          # --timeout kills a hung test's process tree instead of leaving it orphaned
          ctest --output-on-failure --timeout 120

  windows:
    name: Build & test (Windows)
    runs-on: ${{ vars.WINDOWS_RUNNER && fromJSON(vars.WINDOWS_RUNNER) || 'windows-2022' }}
    timeout-minutes: 120  # a cold vcpkg cache builds every dependency, FFmpeg included

    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia qtimageformats'
          cache: true
          # setup-python needs admin to install on Windows; the bootstrap script puts Python on PATH.
          setup-python: ${{ runner.environment != 'self-hosted' }}

      - name: Set up vcpkg
        id: vcpkg
        # A shallow fetch of the manifest's builtin-baseline pins the ports and the tool
        # to the same commit. The image version feeds the cache key below: a runner
        # image with a newer MSVC changes every package ABI.
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          $root = "$env:RUNNER_TEMP\vcpkg"
          git init --quiet $root
          git -C $root fetch --quiet --depth 1 https://github.com/microsoft/vcpkg $baseline
          git -C $root checkout --quiet FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($env:RUNNER_ENVIRONMENT -eq 'self-hosted') {
            # A persistent local cache (see scripts/windows-runner-bootstrap.ps1) replaces actions/cache.
            $cache = if ($env:SNIM_VCPKG_CACHE) { $env:SNIM_VCPKG_CACHE } else { 'C:\snim-ci\vcpkg-cache' }
            # Source archives too, so a package rebuild skips the download.
            $downloads = if ($env:SNIM_VCPKG_DOWNLOADS) { $env:SNIM_VCPKG_DOWNLOADS } else { 'C:\snim-ci\vcpkg-downloads' }
            New-Item -ItemType Directory -Force $downloads | Out-Null
            "VCPKG_DOWNLOADS=$downloads" >> $env:GITHUB_ENV
          } else {
            $cache = "$env:RUNNER_TEMP\vcpkg-cache"
          }
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "cache=$cache" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg packages
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.cache }}
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        # vcpkg installs the manifest's dependencies during this step.
        run: cmake --preset windows-msvc -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build --preset windows-msvc

      - name: Test
        working-directory: build
        # Windows has no rpath: the tests find Qt and the vcpkg DLLs through PATH.
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$pwd\vcpkg_installed\x64-windows-snim\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          # --timeout kills a hung test's process tree instead of leaving it orphaned
          ctest --output-on-failure --timeout 120

      - name: Stage a windeployqt bundle
        id: bundle
        # The install rules copy snim.exe, its vcpkg DLLs and the MSVC runtime, then run windeployqt.
        run: |
          $stage = "$env:RUNNER_TEMP\snim"
          cmake --install build --prefix $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "dir=$stage" >> $env:GITHUB_OUTPUT

      - name: Smoke-test the bundle
        timeout-minutes: 5
        # Only System32 on PATH and no Qt variables, so anything missing from the bundle
        # fails here. snim.exe is a GUI exe whose stdout PowerShell never captures, hence
        # the explicit redirect.
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $out = "$env:RUNNER_TEMP\self-test.txt"
          $p = Start-Process -FilePath "${{ steps.bundle.outputs.dir }}\snim.exe" -ArgumentList '--self-test' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          exit $p.ExitCode

      - name: Upload the bundle
        # For manual testing; a pull request names it after its head commit, not the merge.
        uses: actions/upload-artifact@v4
        with:
          name: snim-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ steps.bundle.outputs.dir }}
          if-no-files-found: error
          retention-days: 14
